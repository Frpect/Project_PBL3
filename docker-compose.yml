version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fashionstore-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  backend:
    build:
      context: ./Project
      dockerfile: Dockerfile
    container_name: fashionstore-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=FASHIONSTORE;User Id=sa;Password=YourStrongPassword123!;TrustServerCertificate=True;
      - JwtSettings__SecretKey=YourSuperSecretKeyForJWT1234567890!
    ports:
      - "5247:80"
    depends_on:
      - db

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: fashionstore-frontend
    environment:
      - VITE_API_BASE=http://localhost:5247
    ports:
      - "3456:80"
    depends_on:
      - backend

volumes:
  mssql-data:
