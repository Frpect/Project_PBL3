<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fashion Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: 'var(--color-primary)',
            'primary-hover': 'var(--color-primary-hover)',
            secondary: 'var(--color-secondary)',
            accent: 'var(--color-accent)',
            'accent-hover': 'var(--color-accent-hover)',
            success: 'var(--color-success)',
            warning: 'var(--color-warning)',
            error: 'var(--color-error)',
            info: 'var(--color-info)',
            surface: 'var(--color-surface)',
            border: 'var(--color-border)',
            'text-primary': 'var(--color-text-primary)',
            'text-secondary': 'var(--color-text-secondary)',
            'text-muted': 'var(--color-text-muted)',
            destructive: 'var(--color-error)',
            'muted-foreground': 'var(--color-text-muted)',
            'background-secondary': 'var(--color-surface)',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Poppins', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="min-h-screen bg-white text-text-primary font-sans">
  <div id="root" class="min-h-screen flex flex-col"></div>
  <div id="toast-container" class="fixed top-4 right-4 z-[9999] flex flex-col gap-2"></div>
  <div id="dialog-overlay" class="hidden fixed inset-0 z-[1000]"></div>

  <script src="js/data.bundle.js"></script>
  <script src="js/core.bundle.js"></script>
  <script src="js/client.bundle.js"></script>
  <script src="js/admin.bundle.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
